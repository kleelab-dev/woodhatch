name = "woodhatch-instagram"
main = "worker.js"
compatibility_date = "2025-01-01"

# Paste the id printed by:  npx wrangler kv namespace create IG
[[kv_namespaces]]
binding = "IG"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# The website address(es) allowed to read the feed, comma separated.
# Use "*" while testing, then lock it to the real domain.
ALLOWED_ORIGIN = "*"

# Renew the Instagram token once a day (it only actually renews when it is 7+ days old).
[triggers]
crons = ["0 3 * * *"]
